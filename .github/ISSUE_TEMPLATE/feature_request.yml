name: Feature request
description: Propose a change to a stage, an export target, or the installer
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today, and at which stage?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? If it is a new export target, name the tool it feeds.
    validations:
      required: true
  - type: dropdown
    id: runtimes
    attributes:
      label: Runtimes affected
      multiple: true
      options:
        - All
        - Claude Code
        - Codex
        - OpenCode
        - Cursor
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
